<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Buy Points | Mega Mart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#3e4a3d", "surface-container": "#e5eeff", "on-surface": "#0b1c30",
          "surface-container-low": "#eff4ff", "primary": "#006b2c", "on-primary": "#ffffff",
          "surface": "#f8f9ff", "surface-container-lowest": "#ffffff", "outline-variant": "#bdcaba",
          "background": "#f8f9ff", "on-background": "#0b1c30", "error": "#ba1a1a", "error-container": "#ffdad6",
          "on-error-container": "#93000a"
        },
        "borderRadius": { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "xl": "32px", "md": "16px", "xs": "4px", "lg": "24px", "sm": "8px" }
      }}}
    </script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .type-tab.active { background: #006b2c; color: #fff; }
    #toast { display: none; } #toast.active { display: flex; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
<header class="fixed top-0 left-0 w-full z-50 flex items-center gap-sm px-md h-16 shadow-sm bg-surface">
<a class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-surface-container-high" href="jobs.html">arrow_back</a>
<span class="font-bold text-primary text-xl">Buy Points</span>
</header>

<main class="mt-20 px-md max-w-[560px] mx-auto space-y-lg">

<div class="hidden p-md bg-error-container rounded-lg" id="form_error">
<p class="text-sm text-on-error-container" id="form_error_text"></p>
</div>

<!-- Current balances -->
<div class="grid grid-cols-2 gap-md">
<div class="bg-white border border-outline-variant/20 rounded-xl p-md text-center">
<p class="text-xs text-on-surface-variant">Post Points</p>
<p class="text-2xl font-bold text-primary" id="post_balance">—</p>
</div>
<div class="bg-white border border-outline-variant/20 rounded-xl p-md text-center">
<p class="text-xs text-on-surface-variant">Job Points</p>
<p class="text-2xl font-bold text-primary" id="apply_balance">—</p>
</div>
</div>

<div class="bg-white border border-outline-variant/20 rounded-xl p-lg space-y-md">
<div class="flex gap-sm p-1 bg-surface-container-low rounded-lg" id="type_tabs">
<button class="type-tab flex-1 py-2 rounded-md text-sm font-bold active" data-type="post">Post Points</button>
<button class="type-tab flex-1 py-2 rounded-md text-sm font-bold text-on-surface-variant" data-type="apply">Job Points</button>
</div>

<p class="text-sm text-on-surface-variant" id="type_explainer">Post Points are spent when you post a job — you need 50 to post one listing. ₦30 per point.</p>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="quantity_input">How many points?</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg" id="quantity_input" min="1" type="number" value="50"/>
</div>

<div class="flex gap-sm">
<button class="quick-qty flex-1 h-10 border border-outline-variant rounded-lg text-sm font-bold" data-qty="50">50</button>
<button class="quick-qty flex-1 h-10 border border-outline-variant rounded-lg text-sm font-bold" data-qty="100">100</button>
<button class="quick-qty flex-1 h-10 border border-outline-variant rounded-lg text-sm font-bold" data-qty="250">250</button>
</div>

<div class="flex justify-between items-center p-md bg-surface-container-low rounded-lg">
<span class="text-sm text-on-surface-variant">Total</span>
<span class="text-2xl font-bold text-primary" id="total_price">₦1,500</span>
</div>

<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-bold" id="pay_btn">Pay Now</button>
<p class="text-xs text-on-surface-variant text-center">After payment, your points are added to your account once confirmed by our team — usually within a few hours.</p>
</div>

</main>

<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#213145] text-white px-lg py-sm rounded-full shadow-xl items-center gap-sm z-50" id="toast">
<span class="material-symbols-outlined text-[#7ffc97]">check_circle</span>
<span class="text-sm" id="toast_text"></span>
</div>

<script>
    const SUPABASE_URL = "https://wexvdmimqqiwarvswwbi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndleHZkbWltcXFpd2FydnN3d2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUzNjgsImV4cCI6MjA5ODQ3MTM2OH0.qwVb9IfUgqGsvt8nm-zINQrCtJjzmio8mWgxOWJCgZQ";
    const PAYSTACK_PUBLIC_KEY = "pk_live_383a0e2b83c984d24a655080a848924537c4f3bc";
    const PRICE_PER_POINT = 30;

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let selectedType = 'post';

    function showError(msg) {
        document.getElementById('form_error_text').textContent = msg;
        document.getElementById('form_error').classList.remove('hidden');
    }
    function showToast(msg) {
        document.getElementById('toast_text').textContent = msg;
        const t = document.getElementById('toast');
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
    }

    const EXPLAINERS = {
        post: 'Post Points are spent when you post a job — you need 50 to post one listing. ₦30 per point.',
        apply: 'Job Points are spent when you apply to a job — you need 20 to submit one application. ₦30 per point.'
    };

    document.querySelectorAll('.type-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedType = btn.getAttribute('data-type');
            document.getElementById('type_explainer').textContent = EXPLAINERS[selectedType];
            document.getElementById('quantity_input').value = selectedType === 'post' ? 50 : 20;
            updateTotal();
        });
    });

    document.querySelectorAll('.quick-qty').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById('quantity_input').value = btn.getAttribute('data-qty');
            updateTotal();
        });
    });

    document.getElementById('quantity_input').addEventListener('input', updateTotal);

    function updateTotal() {
        const qty = Math.max(1, parseInt(document.getElementById('quantity_input').value) || 0);
        document.getElementById('total_price').textContent = '₦' + (qty * PRICE_PER_POINT).toLocaleString();
    }

    async function loadBalances() {
        const { data: profile } = await supabaseClient
            .from('profiles').select('post_points_balance, job_points_balance').eq('id', currentUser.id).maybeSingle();
        document.getElementById('post_balance').textContent = profile?.post_points_balance ?? 0;
        document.getElementById('apply_balance').textContent = profile?.job_points_balance ?? 0;
    }

    document.getElementById('pay_btn').addEventListener('click', () => {
        const qty = Math.max(1, parseInt(document.getElementById('quantity_input').value) || 0);
        const amountNaira = qty * PRICE_PER_POINT;

        const handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: currentUser.email,
            amount: amountNaira * 100,
            currency: 'NGN',
            ref: 'MEGAMART-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
            metadata: { purpose: 'points_purchase', user_id: currentUser.id, point_type: selectedType, quantity: qty },
            callback: function () {
                showToast('Payment received! Your points will be added once confirmed.');
                setTimeout(() => { window.location.href = 'jobs.html'; }, 2200);
            },
            onClose: function () {}
        });
        handler.openIframe();
    });

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href); return; }
        currentUser = user;

        const params = new URLSearchParams(window.location.search);
        const typeParam = params.get('type');
        if (typeParam === 'apply' || typeParam === 'post') {
            document.querySelector(`.type-tab[data-type="${typeParam}"]`).click();
        }

        await loadBalances();
        updateTotal();
    }

    init();
</script>
</body></html>
