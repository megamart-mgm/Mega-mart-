<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Settings | Mega Mart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#3e4a3d", "surface-container": "#e5eeff", "on-surface": "#0b1c30",
          "surface-container-low": "#eff4ff", "primary": "#006b2c", "on-primary": "#ffffff",
          "surface": "#f8f9ff", "surface-container-lowest": "#ffffff", "outline-variant": "#bdcaba",
          "background": "#f8f9ff", "on-background": "#0b1c30", "error": "#ba1a1a", "error-container": "#ffdad6",
          "on-error-container": "#93000a"
        },
        "borderRadius": { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "xl": "32px", "md": "16px", "xs": "4px", "lg": "24px", "sm": "8px" }
      }}}
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .input-focus:focus { outline: none; border-color: #006b2c; box-shadow: 0 0 0 3px rgba(0,107,44,0.15); }
        .section-card { background: #fff; border: 1px solid #e5eeff; border-radius: 12px; }
        .field-error { border-color: #ba1a1a !important; box-shadow: 0 0 0 3px rgba(186, 26, 26, 0.12); }
        #form_error { display: none; } #form_error.active { display: block; }
        #save_toast { display: none; } #save_toast.active { display: flex; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
<header class="fixed top-0 left-0 w-full z-50 flex items-center gap-sm px-md h-16 shadow-sm bg-surface">
<a class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95" href="store.html" id="back_link">arrow_back</a>
<span class="font-bold text-primary text-xl">Profile Settings</span>
</header>

<main class="mt-20 px-md max-w-[560px] mx-auto space-y-lg">

<div class="hidden p-md bg-error-container rounded-lg" id="form_error">
<p class="font-label-md text-label-md text-on-error-container" id="form_error_text"></p>
</div>

<!-- Profile info -->
<section class="section-card p-lg space-y-md">
<div>
<h2 class="font-bold text-lg text-on-surface">Profile</h2>
<p class="text-sm text-on-surface-variant">This is what people see when they chat with you.</p>
</div>

<div class="flex items-center gap-md">
<div class="w-20 h-20 rounded-full bg-surface-container-high overflow-hidden flex items-center justify-center flex-shrink-0" id="avatar_preview">
<span class="material-symbols-outlined text-3xl text-tertiary">person</span>
</div>
<div>
<input accept="image/*" class="hidden" id="avatar_input" type="file"/>
<button class="bg-surface-container-low text-on-surface px-md py-2 rounded-lg text-sm font-bold" id="choose_photo_btn" type="button">Change Photo</button>
</div>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="full_name">Full Name</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg input-focus text-sm" id="full_name" placeholder="Your name" type="text"/>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="phone_number">Phone Number</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg input-focus text-sm" id="phone_number" placeholder="+234..." type="tel"/>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="location">Location</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg input-focus text-sm" id="location" placeholder="e.g. Lagos, Nigeria" type="text"/>
<p class="text-xs text-on-surface-variant">A general area is fine — no need for your exact address.</p>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="delivery_address">Delivery Address <span class="text-tertiary font-normal">(used for physical product orders)</span></label>
<textarea class="w-full px-4 py-sm bg-white border border-[#E2E8F0] rounded-lg input-focus text-sm" id="delivery_address" placeholder="Street address for deliveries" rows="2"></textarea>
</div>
</section>

<!-- Account -->
<section class="section-card p-lg space-y-md">
<div>
<h2 class="font-bold text-lg text-on-surface">Account</h2>
<p class="text-sm text-on-surface-variant">Your login details.</p>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant">Email</label>
<p class="text-sm text-on-surface" id="account_email">—</p>
</div>

<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="new_password">New Password <span class="text-tertiary font-normal">(leave blank to keep your current one)</span></label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg input-focus text-sm" id="new_password" minlength="6" placeholder="••••••••" type="password"/>
</div>
</section>

<div class="sticky bottom-4 flex justify-end">
<button class="bg-primary text-on-primary px-xl py-sm rounded-lg font-bold shadow-lg active:scale-95 transition-all disabled:opacity-60" id="save_btn" type="button">
Save Changes
</button>
</div>

</main>

<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#213145] text-white px-lg py-sm rounded-full shadow-xl items-center gap-sm z-50" id="save_toast">
<span class="material-symbols-outlined text-[#7ffc97]">check_circle</span>
<span class="text-sm font-bold" id="save_toast_text">Saved!</span>
</div>

<script>
    const SUPABASE_URL = "https://wexvdmimqqiwarvswwbi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndleHZkbWltcXFpd2FydnN3d2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUzNjgsImV4cCI6MjA5ODQ3MTM2OH0.qwVb9IfUgqGsvt8nm-zINQrCtJjzmio8mWgxOWJCgZQ";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let pendingAvatarFile = null;
    let currentAvatarUrl = null;

    function showError(msg) {
        document.getElementById('form_error_text').textContent = msg;
        document.getElementById('form_error').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function clearError() {
        document.getElementById('form_error').classList.remove('active');
    }

    document.getElementById('choose_photo_btn').addEventListener('click', () => document.getElementById('avatar_input').click());

    document.getElementById('avatar_input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) { showError('Please choose an image file.'); e.target.value = ''; return; }
        if (file.size > 3 * 1024 * 1024) { showError('Your photo must be under 3MB.'); e.target.value = ''; return; }

        clearError();
        pendingAvatarFile = file;
        document.getElementById('avatar_preview').innerHTML = `<img src="${URL.createObjectURL(file)}" class="w-full h-full object-cover" />`;
    });

    async function loadProfile() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href); return; }
        currentUser = user;

        document.getElementById('account_email').textContent = user.email;

        const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('full_name, avatar_url, phone_number, location, delivery_address, role')
            .eq('id', user.id)
            .maybeSingle();

        if (error) { showError('Could not load your profile: ' + error.message); return; }

        if (profile) {
            document.getElementById('full_name').value = profile.full_name || '';
            document.getElementById('phone_number').value = profile.phone_number || '';
            document.getElementById('location').value = profile.location || '';
            document.getElementById('delivery_address').value = profile.delivery_address || '';
            if (profile.avatar_url) {
                currentAvatarUrl = profile.avatar_url;
                document.getElementById('avatar_preview').innerHTML = `<img src="${profile.avatar_url}" class="w-full h-full object-cover" />`;
            }
            document.getElementById('back_link').href = profile.role === 'seller' ? 'sel.html' : 'store.html';
        }
    }

    async function saveProfile() {
        if (!currentUser) return;
        clearError();

        const fullName = document.getElementById('full_name').value.trim();
        if (!fullName) { showError('Please enter your name.'); return; }

        const saveBtn = document.getElementById('save_btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        if (pendingAvatarFile) {
            saveBtn.textContent = 'Uploading photo...';
            const ext = pendingAvatarFile.name.split('.').pop();
            const path = `${currentUser.id}/avatar-${crypto.randomUUID()}.${ext}`;
            const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(path, pendingAvatarFile);

            if (uploadError) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                showError('Could not upload your photo: ' + uploadError.message);
                return;
            }

            const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
            currentAvatarUrl = publicUrlData.publicUrl;
            pendingAvatarFile = null;
        }

        saveBtn.textContent = 'Saving...';

        const { error: profileError } = await supabaseClient.from('profiles').update({
            full_name: fullName,
            avatar_url: currentAvatarUrl,
            phone_number: document.getElementById('phone_number').value.trim() || null,
            location: document.getElementById('location').value.trim() || null,
            delivery_address: document.getElementById('delivery_address').value.trim() || null
        }).eq('id', currentUser.id);

        if (profileError) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
            showError('Could not save your profile: ' + profileError.message);
            return;
        }

        const newPassword = document.getElementById('new_password').value;
        if (newPassword) {
            if (newPassword.length < 6) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                showError('New password must be at least 6 characters.');
                return;
            }
            const { error: pwError } = await supabaseClient.auth.updateUser({ password: newPassword });
            if (pwError) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                showError('Could not update your password: ' + pwError.message);
                return;
            }
            document.getElementById('new_password').value = '';
        }

        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';

        const toast = document.getElementById('save_toast');
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 2500);
    }

    document.getElementById('save_btn').addEventListener('click', saveProfile);

    loadProfile();
</script>
</body></html>
