<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>History | Mega Mart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
   <link rel="manifest" href="/manifest.json">
   <meta name="theme-color" content="#006b2c">
   <link rel="apple-touch-icon" href="/icons/icon-192.png">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <script src="/pwa.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#3e4a3d", "surface-container": "#e5eeff", "on-surface": "#0b1c30",
          "surface-container-low": "#eff4ff", "primary": "#006b2c", "on-primary": "#ffffff",
          "surface": "#f8f9ff", "surface-container-lowest": "#ffffff", "outline-variant": "#bdcaba",
          "background": "#f8f9ff", "on-background": "#0b1c30", "error": "#ba1a1a", "error-container": "#ffdad6",
          "on-error-container": "#93000a", "primary-container": "#00873a"
        },
        "borderRadius": { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "xl": "32px", "md": "16px", "xs": "4px", "lg": "24px", "sm": "8px" }
      }}}
    </script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .tab-active { background: #006b2c; color: #fff; }
    #toast { display: none; }
    #toast.active { display: flex; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">

<header class="fixed top-0 left-0 w-full z-50 flex items-center gap-sm px-md h-14 shadow-sm bg-surface">
<a class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-surface-container-high" href="sel.html">arrow_back</a>
<span class="font-bold text-primary text-lg">History</span>
</header>

<main class="pt-20 px-md max-w-[720px] mx-auto space-y-md">

<div class="hidden p-md bg-error-container rounded-lg" id="error_banner">
<p class="text-sm text-on-error-container" id="error_text"></p>
</div>

<!-- Balance summary -->
<div class="bg-primary-container/10 border border-primary/20 p-lg rounded-xl">
<p class="text-on-surface-variant text-sm">Current wallet balance</p>
<p class="text-3xl font-bold text-primary mt-1" id="balance_display">₦0.00</p>
</div>

<!-- Filter tabs -->
<div class="flex gap-2 overflow-x-auto pb-1" id="filter_tabs">
<button class="tab-active px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap" data-filter="all">All</button>
<button class="bg-surface-container-low text-on-surface-variant px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap" data-filter="sale">Sales</button>
<button class="bg-surface-container-low text-on-surface-variant px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap" data-filter="withdrawal">Withdrawals</button>
<button class="bg-surface-container-low text-on-surface-variant px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap" data-filter="fee">Fees</button>
<button class="bg-surface-container-low text-on-surface-variant px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap" data-filter="refund">Refunds</button>
</div>

<!-- Transaction list -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/20 divide-y divide-outline-variant/10" id="tx_list">
<p class="p-md text-on-surface-variant text-sm">Loading history...</p>
</div>

<button class="hidden w-full h-11 bg-surface-container-low text-primary rounded-lg text-sm font-bold" id="load_more_btn">Load more</button>

</main>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#213145] text-white px-lg py-sm rounded-full shadow-xl items-center gap-sm z-[60] max-w-[92vw]" id="toast">
<span class="material-symbols-outlined text-primary flex-shrink-0">history</span>
<span class="font-medium text-sm truncate" id="toast_text"></span>
</div>

<script>
    const SUPABASE_URL = "https://wexvdmimqqiwarvswwbi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndleHZkbWltcXFpd2FydnN3d2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUzNjgsImV4cCI6MjA5ODQ3MTM2OH0.qwVb9IfUgqGsvt8nm-zINQrCtJjzmio8mWgxOWJCgZQ";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PAGE_SIZE = 25;
    let storeId = null;
    let currentFilter = 'all';
    let currentOffset = 0;
    let allLoadedRows = [];

    function showToast(msg) {
        document.getElementById('toast_text').textContent = msg;
        const t = document.getElementById('toast');
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
    }

    function showError(msg) {
        document.getElementById('error_text').textContent = msg;
        document.getElementById('error_banner').classList.remove('hidden');
    }

    function walletStatusBadge(status) {
        const map = {
            pending: 'bg-surface-container text-on-surface-variant',
            completed: 'bg-primary-container/20 text-primary',
            success: 'bg-primary-container/20 text-primary',
            failed: 'bg-error-container text-on-error-container'
        };
        return map[status] || 'bg-surface-container text-on-surface-variant';
    }

    function walletTypeIcon(type) {
        return { sale: 'sell', withdrawal: 'account_balance', fee: 'percent', refund: 'undo' }[type] || 'receipt_long';
    }

    function walletTypeLabel(type) {
        return { sale: 'Sale', withdrawal: 'Withdrawal', fee: 'Platform Fee', refund: 'Refund' }[type] || type;
    }

    function renderRow(tx) {
        const positive = Number(tx.amount) >= 0;
        const amountLabel = (positive ? '+' : '-') + '₦' + Math.abs(Number(tx.amount)).toLocaleString(undefined, { minimumFractionDigits: 2 });
        return `
            <div class="flex items-center gap-sm p-md">
                <div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-primary text-lg">${walletTypeIcon(tx.type)}</span>
                </div>
                <div class="min-w-0 flex-1">
                    <p class="font-bold text-on-surface truncate">${walletTypeLabel(tx.type)}</p>
                    <p class="text-xs text-on-surface-variant truncate">${tx.description || ''}</p>
                    <p class="text-[11px] text-on-surface-variant/70">${new Date(tx.created_at).toLocaleString()}</p>
                </div>
                <div class="text-right flex-shrink-0">
                    <p class="font-bold ${positive ? 'text-primary' : 'text-on-surface'}">${amountLabel}</p>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${walletStatusBadge(tx.status)}">${tx.status.toUpperCase()}</span>
                </div>
            </div>
        `;
    }

    function renderList() {
        const list = document.getElementById('tx_list');
        const filtered = currentFilter === 'all' ? allLoadedRows : allLoadedRows.filter(tx => tx.type === currentFilter);

        if (filtered.length === 0) {
            list.innerHTML = '<p class="p-md text-on-surface-variant text-sm">No transactions here yet.</p>';
            return;
        }
        list.innerHTML = filtered.map(renderRow).join('');
    }

    async function loadBalance() {
        const { data } = await supabaseClient.from('stores').select('wallet_balance').eq('id', storeId).maybeSingle();
        const balance = Number(data?.wallet_balance || 0);
        document.getElementById('balance_display').textContent = '₦' + balance.toLocaleString(undefined, { minimumFractionDigits: 2 });
    }

    async function loadPage(reset) {
        if (reset) { currentOffset = 0; allLoadedRows = []; }

        const { data, error } = await supabaseClient
            .from('wallet_transactions')
            .select('*')
            .eq('store_id', storeId)
            .order('created_at', { ascending: false })
            .range(currentOffset, currentOffset + PAGE_SIZE - 1);

        if (error) { showError('Could not load history: ' + error.message); return; }

        allLoadedRows = allLoadedRows.concat(data || []);
        currentOffset += PAGE_SIZE;

        document.getElementById('load_more_btn').classList.toggle('hidden', (data || []).length < PAGE_SIZE);
        renderList();
    }

    document.getElementById('filter_tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-filter]');
        if (!btn) return;

        document.querySelectorAll('#filter_tabs button').forEach(b => {
            b.classList.remove('tab-active');
            b.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        });
        btn.classList.add('tab-active');
        btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');

        currentFilter = btn.getAttribute('data-filter');
        renderList();
    });

    document.getElementById('load_more_btn').addEventListener('click', () => loadPage(false));

    function subscribeRealtime() {
        supabaseClient
            .channel('history-' + storeId)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'wallet_transactions', filter: `store_id=eq.${storeId}` }, () => {
                loadBalance();
                loadPage(true);
                showToast('Wallet activity updated');
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stores', filter: `id=eq.${storeId}` }, () => loadBalance())
            .subscribe();
    }

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) {
            window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
            return;
        }

        const { data: store, error } = await supabaseClient.from('stores').select('id').eq('seller_id', user.id).maybeSingle();
        if (error || !store) { showError('Could not load your store.'); return; }

        storeId = store.id;
        await loadBalance();
        await loadPage(true);
        subscribeRealtime();
    }

    init();
</script>
</body></html>
