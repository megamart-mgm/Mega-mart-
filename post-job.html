<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post a Job | Mega Mart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#3e4a3d", "surface-container": "#e5eeff", "on-surface": "#0b1c30",
          "surface-container-low": "#eff4ff", "primary": "#006b2c", "on-primary": "#ffffff",
          "surface": "#f8f9ff", "surface-container-lowest": "#ffffff", "outline-variant": "#bdcaba",
          "background": "#f8f9ff", "on-background": "#0b1c30", "error": "#ba1a1a", "error-container": "#ffdad6",
          "on-error-container": "#93000a"
        },
        "borderRadius": { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "xl": "32px", "md": "16px", "xs": "4px", "lg": "24px", "sm": "8px" }
      }}}
    </script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .section-card { background: #fff; border: 1px solid #e5eeff; border-radius: 12px; }
    #save_toast { display: none; } #save_toast.active { display: flex; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
<header class="fixed top-0 left-0 w-full z-50 flex items-center gap-sm px-md h-16 shadow-sm bg-surface">
<a class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-surface-container-high" href="jobs.html">arrow_back</a>
<span class="font-bold text-primary text-xl">Post a Job</span>
</header>

<main class="mt-20 px-md max-w-[640px] mx-auto space-y-lg">

<div class="hidden p-md bg-error-container rounded-lg" id="form_error">
<p class="text-sm text-on-error-container" id="form_error_text"></p>
</div>

<div class="section-card p-lg flex items-center justify-between">
<div>
<p class="text-sm text-on-surface-variant">Your Post Points balance</p>
<p class="text-2xl font-bold text-primary" id="balance_display">—</p>
</div>
<a class="text-primary text-sm font-bold hover:underline" href="buy-points.html?type=post">Buy more →</a>
</div>

<div class="section-card p-lg space-y-md">
<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="job_title">Job Title</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg" id="job_title" placeholder="e.g. Need a logo designer for my new brand" type="text"/>
</div>
<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="job_category">Category</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg" id="job_category" placeholder="e.g. Graphic Design, Writing, Web Dev" type="text"/>
</div>
<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="job_description">Description</label>
<textarea class="w-full px-4 py-sm bg-white border border-[#E2E8F0] rounded-lg" id="job_description" placeholder="Describe what you need done, timeline, requirements..." rows="6"></textarea>
</div>
<div class="grid grid-cols-2 gap-sm">
<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="budget_type">Budget Type</label>
<select class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg" id="budget_type">
<option value="fixed">Fixed Price</option>
<option value="hourly">Hourly Rate</option>
</select>
</div>
<div class="space-y-xs">
<label class="block text-sm font-medium text-on-surface-variant" for="budget_amount">Budget (₦)</label>
<input class="w-full h-12 px-4 bg-white border border-[#E2E8F0] rounded-lg" id="budget_amount" min="0" placeholder="Optional" type="number"/>
</div>
</div>
</div>

<button class="w-full h-[52px] bg-primary text-on-primary rounded-lg font-bold disabled:opacity-60" id="submit_btn" type="button">Post Job — Uses 50 Post Points</button>

</main>

<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#213145] text-white px-lg py-sm rounded-full shadow-xl items-center gap-sm z-50" id="save_toast">
<span class="material-symbols-outlined text-[#7ffc97]">check_circle</span>
<span class="text-sm" id="save_toast_text">Job posted!</span>
</div>

<script>
    const SUPABASE_URL = "https://wexvdmimqqiwarvswwbi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndleHZkbWltcXFpd2FydnN3d2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUzNjgsImV4cCI6MjA5ODQ3MTM2OH0.qwVb9IfUgqGsvt8nm-zINQrCtJjzmio8mWgxOWJCgZQ";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentBalance = 0;
    let isOfficialAccount = false;

    function showError(msg) {
        document.getElementById('form_error_text').textContent = msg;
        document.getElementById('form_error').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadBalance() {
        const { data: profile } = await supabaseClient.from('profiles').select('post_points_balance, is_official').eq('id', currentUser.id).maybeSingle();
        currentBalance = profile?.post_points_balance ?? 0;
        isOfficialAccount = profile?.is_official ?? false;
        document.getElementById('balance_display').textContent = isOfficialAccount ? 'Unlimited' : currentBalance + ' points';

        const btn = document.getElementById('submit_btn');
        if (!isOfficialAccount && currentBalance < 50) {
            btn.disabled = true;
            showError(`You need 50 Post Points to post a job — you currently have ${currentBalance}. Buy more points above to continue.`);
        }
    }

    document.getElementById('submit_btn').addEventListener('click', async () => {
        document.getElementById('form_error').classList.add('hidden');

        const title = document.getElementById('job_title').value.trim();
        const description = document.getElementById('job_description').value.trim();
        const category = document.getElementById('job_category').value.trim();
        const budgetType = document.getElementById('budget_type').value;
        const budgetAmount = document.getElementById('budget_amount').value;

        if (!title) { showError('Please enter a job title.'); return; }
        if (!description) { showError('Please enter a job description.'); return; }

        const btn = document.getElementById('submit_btn');
        btn.disabled = true;
        btn.textContent = 'Posting...';

        const { error } = await supabaseClient.rpc('post_job', {
            p_title: title,
            p_description: description,
            p_category: category || null,
            p_budget_type: budgetType,
            p_budget_amount: budgetAmount ? parseFloat(budgetAmount) : null
        });

        if (error) {
            btn.disabled = false;
            btn.textContent = 'Post Job — Uses 50 Post Points';
            if (error.message.includes('INSUFFICIENT_POINTS')) {
                showError('You don\'t have enough Post Points. Buy more above to continue.');
            } else {
                showError('Could not post job: ' + error.message);
            }
            return;
        }

        const toast = document.getElementById('save_toast');
        toast.classList.add('active');
        setTimeout(() => { window.location.href = 'jobs.html'; }, 1800);
    });

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href); return; }
        currentUser = user;
        await loadBalance();
    }

    init();
</script>
</body></html>
